name: Pinegrow branch sync

on:
  push:
    branches: [main, pinegrow/mx, pinegrow/collaborator]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: write
  checks: write

concurrency:
  group: pinegrow-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted automation from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test branch synchronization
        run: python3 -m unittest discover -s .github/tests
      - name: Sync branches and report their status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/pinegrow_sync.py
